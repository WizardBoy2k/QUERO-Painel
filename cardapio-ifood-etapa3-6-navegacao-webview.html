/* ===== ETAPA 3 — AVALIAÇÃO APÓS O PEDIDO (etapas, nuvem e pendências) =====
Somente neste aparelho (localStorage); sem Firebase e sem sincronização.
Novo estado: S.rvq[idDoPedido]={v:visita em que a conclusão foi notada, cl:1 se a nuvem já foi mostrada, done:1 se a avaliação foi concluída}.
As avaliações enviadas entram em S.reviews no formato da etapa 2 (target, itemId, itemName, group, rating, comment, author, date, orderId, phone, status),

function rvPend(o){return !!(o&&o.mine&&o.st==2&&!rvQr(o.id).done&&rvSteps(o).length)}

const rvWrap=m=>`<div class="rvz${m=='in'?' rvin':''}" data-m="${m}">${rvBody(m)}</div>`;
function rvBody(m){const o=rvOrd(RW.oid);if(!o)return '';

const st=rvSteps(o);if(!st.length)return '';const i=Math.max(0,Math.min(RW.i,st.length-1)),s=st[i],d=RD[o.id]||{},last=i==st.length-1,ttl={casa:'Casa',lanches:'Lanches comprados',produtos:'Produtos comprados'}[s.g];
return `<div class="rvsc"><p class="rvk">${m=='cl'?'☁️ Você ainda não avaliou o pedido ':'⭐ Avalie o pedido '}${pid(o.id)}</p><div class="rvst3">Etapa ${i+1} de ${st.length}</div><h3 class="rvtt">${RVC[s.g].e} ${ttl}</h3><div class="rvli">${s.its.map(x=>{const e=d[x.k]||{r:0,c:''};return `<div class="rvq3" data-k="${esc(x.k)}"><div class="rvn3"><b>${esc(x.name)}</b><small>${x.t=='store'?esc(RVC.casa.d):x.qty+'x neste pedido'}</small></div><div class="rvs3" role="radiogroup" aria-label="Nota para ${esc(x.name)}">${[1,2,3,4,5].map(n=>`<button type="button" role="radio" aria-checked="${e.r==n}" aria-label="${n} ${n==1?'estrela':'estrelas'}" class="${n<=e.r?'on':''}" onclick="rvR('${x.k}',${n})"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#st"/></svg></button>`).join('')}</div><textarea class="inp rvc3" maxlength="300" placeholder="Comentário (opcional)" aria-label="Comentário opcional sobre ${esc(x.name)}" oninput="rvC('${x.k}',this.value)">${esc(e.c)}</textarea></div>`}).join('')}</div></div>
<div class="rvf3"><nav class="rvt3" aria-label="Etapas da avaliação">${st.map((z,j)=>`<button type="button" class="${j==i?'on':''}" ${j==i?'aria-current="step"':''} onclick="rvGo(${j})"><span aria-hidden="true">${RVC[z.g].e}</span>${RVC[z.g].n}</button>`).join('')}</nav><button type="button" class="btn rvb3" onclick="rvNext()">${last?'Concluir':'Continuar'}</button></div>`}
function rvDraft(k){const o=rvOrd(RW.oid);if(!o)return null;const d=RD[o.id]=RD[o.id]||{};return d[k]=d[k]||{r:0,c:''}}
function rvR(k,n){const e=rvDraft(k);if(!e)return;e.r=n;document.querySelectorAll('.rvq3').forEach(q=>{if(q.dataset.k!==k)return;q.querySelectorAll('.rvs3 button').forEach((b,j)=>{b.classList.toggle('on',j<n);b.setAttribute('aria-checked',String(j==n-1))})})}

function rvUp(){document.querySelectorAll('.rvz').forEach(e=>{e.innerHTML=rvBody(e.dataset.m)});const s=document.querySelector('.rvcl .rvsc');if(s)s.scrollTop=0;const z=document.querySelector('.rvin');if(z&&z.getBoundingClientRect().top<0)z.scrollIntoView({block:'start'})}

function rvSend(){const o=rvOrd(RW.oid);if(!o||RW.th)return;const d=RD[o.id]||{},ds=new Date().toISOString(),L=[];
rvSteps(o).forEach(s=>s.its.forEach(x=>{const e=d[x.k];if(!e||!(e.r>=1&&e.r<=5)||!rvCan(o.id,x.t,x.item))return;const r={id:'rv'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),target:x.t,itemId:x.t=='item'?x.item:null,rating:e.r,comment:String(e.c||'').trim().slice(0,300),author:String(o.name||'Cliente'),date:ds,orderId:o.id,phone:o.phone||'',status:RVSTATUS};if(x.t=='item'){r.itemName=x.name;r.group=x.g}L.push(r)}));

S.reviews.push(...L);rvQ(o.id).done=1;delete RD[o.id];RC=null;save();RW.th=1;rvUp();setTimeout(rvEnd,2300)}
function rvEnd(){RW={oid:null,i:0,th:0};RCL=null;render()}

return rvQr(o.id).done?'<p class="rvdn">✓ Avaliação enviada. Obrigado!</p>':''}

return `<div class="rvo" role="dialog" aria-modal="true" aria-label="Avaliar pedido ${pid(o.id)}"><div class="rvcl"><button type="button" class="rvx3" aria-label="Fechar" onclick="rvX()">✕</button>${rvWrap('cl')}</div></div>`}

if(RVV||RCL||!(r=='cardapio'||r.startsWith('categoria-')))return;const p=rvPends();if(!p.length)return;const q=rvQr(p[0].id);if(q.cl||q.v===RWV)return;
p.forEach(x=>rvQ(x.id).cl=1);RVV=true;RCL={oid:p[0].id};rvSet(p[0].id);save()}
/* ===== PEDIDOS / RASTREIO / NOTIFICAÇÃO ===== */
const NM=['Recebido','Preparando','Pedido Pronto!'],SI=['🧾','🍳','✅'],stI=o=>o.st==2?3:o.st==3?2:o.st==1?1:0;
const LS={};S.orders.filter(o=>o.mine).forEach(o=>LS[o.id]=o.st);

function notify(o){const T={0:['Pedido recebido','Aguardando a loja confirmar'],4:['Pedido aceito','A loja aceitou o seu pedido'],1:['Preparando seu pedido 🍳','Pedido '+pid(o.id)+' em preparo'],3:['Pedido pronto! 🎉','O pedido '+pid(o.id)+' está pronto'],2:['Pedido entregue','Bom apetite!']}[o.st];if(!T)return;toast(T[0]);if(pfN('vib'))try{navigator.vibrate&&navigator.vibrate(o.st==3?[200,100,200]:120)}catch(e){}if(pfN('push'))try{if(ntEstado()=='granted')new Notification(T[0],{body:T[1],tag:'clo-'+o.id})}catch(e){}}

function pedv(){const m=S.orders.filter(o=>o.mine),ac=m.filter(o=>o.st!=2),hs=m.filter(o=>o.st==2),

/* ===== BARRA INFERIOR — toque robusto em WebViews =====
O atalho dispara no pointerup/touchend e também no click (teclado, leitores de tela, WebViews sem pointer events).
O click que vem logo depois de um toque já tratado é ignorado; o clique nativo do <a> é sempre cancelado para não navegar duas vezes. */
(function(){const q=e=>{const t=e.target;return t&&t.closest?t.closest('.bn a[data-h]'):null};let x0=0,y0=0,mv=0,tt=0;
const nv=a=>{tt=Date.now();go(a.getAttribute('data-h'))},st=(e,p)=>{if(q(e)){x0=p.clientX;y0=p.clientY;mv=0}},mm=p=>{if(Math.abs(p.clientX-x0)>10||Math.abs(p.clientY-y0)>10)mv=1};
if(window.PointerEvent){document.addEventListener('pointerdown',e=>st(e,e),true);document.addEventListener('pointermove',mm,true);document.addEventListener('pointerup',e=>{const a=q(e);if(a&&!mv&&!(e.pointerType=='mouse'&&e.button))nv(a)},true)}
else{document.addEventListener('touchstart',e=>st(e,e.changedTouches[0]),true);document.addEventListener('touchmove',e=>mm(e.changedTouches[0]),true);document.addEventListener('touchend',e=>{const a=q(e);if(a&&!mv)nv(a)},true)}
document.addEventListener('click',e=>{const a=q(e);if(!a)return;e.preventDefault();if(Date.now()-tt>700)nv(a)},true)})();
render();
